<!doctype html><html><head><meta charset="utf-8"><title>Track picker</title><link rel="stylesheet" href="dialed.css"><link rel="stylesheet" href="ride.css"></head><body><div class="phone">
<div class="eyebrow">Track</div><div class="h1">WHERE ARE YOU RIDING?</div>
<div class="pick" style="min-height:56px;gap:10px;justify-content:flex-start"><i class="ti ti-search"></i><span class="e" style="margin:0">Search or name a track</span></div>
<div class="label" style="margin:6px 0 8px">Recent</div>
<div class="pick on"><div><div class="t">OMC Motocross Park</div><div class="small">6 rides · OMC baseline saved</div></div><i class="ti ti-bookmark" style="color:var(--blue)"></i></div>
<div class="pick"><div><div class="t">St. Anthony Dunes</div><div class="small">2 rides · Dunes setup</div></div></div>
<div class="pick"><div><div class="t">Owyhee trails</div><div class="small">1 ride</div></div></div>
<div class="label" style="margin:6px 0 8px">Nearby</div>
<div class="pick"><div><div class="t">Boise Motocross</div><div class="small">1.8 mi · ridden by 14 others</div></div><i class="ti ti-map-pin"></i></div>
<div class="pick empty" style="margin-top:auto;justify-content:center;color:var(--steel);font-size:14px"><i class="ti ti-plus" style="color:var(--blue);font-size:16px"></i>&nbsp; New track here (uses your location once)</div>
</div></body></html>
